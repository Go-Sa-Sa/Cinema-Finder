name: Crawl Cinema Schedule

on:
  schedule:
    # 毎日午前 6:00 JST (21:00 UTC) に実行
    - cron: '0 21 * * *'
  workflow_dispatch: # 手動実行可能にする

jobs:
  crawl:
    runs-on: ubuntu-latest

    permissions:
      contents: write # リポジトリへの書き込み権限を与える

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run crawler
      run: |
        python crawler.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add movies_data.json movie_urls.json
        
        # 変更がある場合のみコミットしてプッシュ
        if ! git diff --cached --exit-code; then
          git commit -m "Auto-update movie schedules (JST: $(date -d '9 hours' '+%Y-%m-%d %H:%M:%S'))"
          git push
        else
          echo "No changes in movie data. Skip commit."
        fi
